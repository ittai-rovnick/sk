name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Minimal permissions — these jobs only need to read the repository.
permissions:
  contents: read

jobs:
  # ── React / Vite frontend ────────────────────────────────────────────────
  web-build:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geo-platform/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: geo-platform/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Use a placeholder during CI — real value is set in Vercel dashboard
          VITE_API_URL: https://example.com

  # ── FastAPI backend ──────────────────────────────────────────────────────
  api-check:
    name: API — install & import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geo-platform/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: geo-platform/api/requirements.txt

      - name: Install system deps (libpq for psycopg3)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify app imports
        # Confirm the FastAPI app can be imported without a live database.
        # Full integration tests (pytest) require Postgres + Redis — run locally
        # or add service containers here when the test suite is wired up.
        run: |
          python - <<'EOF'
          import sys, os
          os.environ.setdefault("META_DB_URL", "postgresql+psycopg://u:p@localhost/meta")
          os.environ.setdefault("META_DB_DIRECT_URL", "postgresql+psycopg://u:p@localhost/meta")
          os.environ.setdefault("FEATURES_SHARD_0_URL", "postgresql+psycopg://u:p@localhost/features")
          from app.config import settings
          from app.main import app
          print("Import check passed — FastAPI app loaded successfully")
          EOF
