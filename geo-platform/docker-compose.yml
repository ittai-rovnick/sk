services:

  postgres_meta:
    image: postgis/postgis:16-3.4
    container_name: geo_meta
    environment:
      POSTGRES_DB: geo_meta
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopassword
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geo_meta"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_features:
    image: postgis/postgis:16-3.4
    container_name: geo_features
    environment:
      POSTGRES_DB: geo_features
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopassword
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - features_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geo_features"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: geo_pgbouncer
    environment:
      DB_HOST: postgres_meta
      DB_PORT: 5432
      DB_NAME: geo_meta
      DB_USER: geouser
      DB_PASSWORD: geopassword
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      LISTEN_PORT: 6432
    ports:
      - "6432:6432"
    depends_on:
      postgres_meta:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: geo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: geo_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meta_data:
  features_data:
  redis_data:
  minio_data:
